# Render blueprint for the API. The web app is deployed on Vercel (see README, "Deploying").
services:
  - type: web
    name: emberline-api
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    healthCheckPath: /api/health
    disk:
      name: emberline-data
      mountPath: /data
      sizeGB: 5
    envVars:
      - key: DATA_DIR
        value: /data
      - key: FIRMS_MAP_KEY
        sync: false        # set in the Render dashboard, never in git
      - key: WEB_ORIGIN
        sync: false        # your Vercel URL(s), comma-separated
