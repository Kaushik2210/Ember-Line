[project]
name = "emberline"
version = "0.1.0"
description = "Harmonized MODIS + VIIRS fire record: science core and API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.8", "pydantic-settings>=2.4",
  "httpx>=0.27", "polars>=1.5", "pandas>=2.2", "duckdb>=1.1", "pyarrow>=17",
  "h3>=4.0", "numpy>=2.0", "scipy>=1.13", "scikit-learn>=1.5", "statsmodels>=0.14",
  "sse-starlette>=2.1",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "pytest-asyncio>=0.24", "respx>=0.21", "ruff>=0.6", "mypy>=1.11", "pandas-stubs"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["emberline"]

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
